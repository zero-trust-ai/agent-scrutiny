# ---------------------------------------------------------------------------
# Markdown extensions
# ---------------------------------------------------------------------------
[project.markdown]
extensions = [
  "admonition",
  "attr_list",
  "def_list",
  "details",
  "md_in_html",
  "tables",
  "toc",
  "pymdownx.blocks.admonition",
  "pymdownx.blocks.details",
  "pymdownx.blocks.tab",
  "pymdownx.emoji",
  "pymdownx.highlight",
  "pymdownx.inlinehilite",
  "pymdownx.superfences",
  "pymdownx.tabbed",
  "pymdownx.tasklist",
]

[project.markdown.extensions.toc]
permalink = true

[project.markdown.extensions.pymdownx.highlight]
anchor_linenums = true
line_range = true
content_copy = true

[project.markdown.extensions.pymdownx.tabbed]
alternate = true

[project.markdown.extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

