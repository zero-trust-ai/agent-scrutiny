[project]
site_name = "Agent Scrutiny"
site_url  = "https://agent-scrutiny.github.io/"
site_description = "Zero-trust security for AI agents. Never trust. Always verify."
site_author = "Zero-Trust AI Contributors"

# ---------------------------------------------------------------------------
# Theme
# ---------------------------------------------------------------------------
[project.theme]
name = "material"
custom_dir = "overrides"
language = "en"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.expand",
  "navigation.top",
  "search.highlight",
  "search.suggest",
  "content.tabs.link",
  "content.code.copy",
  "content.code.select",
]

[[project.theme.palette]]
media  = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep purple"
accent  = "cyan"
toggle  = { icon = "material/brightness-4", name = "Switch to dark mode" }

[[project.theme.palette]]
media  = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep purple"
accent  = "cyan"
toggle  = { icon = "material/brightness-7", name = "Switch to light mode" }

